<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pro Meet</title>
<style>
:root{--bg:#0f1217;--panel:#171c24;--line:#262d38;--txt:#e8ecf2;--mut:#8b96a8;--acc:#3b82f6;--red:#ef4444;--grn:#22c55e}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);overflow:hidden}
.hidden{display:none!important}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
input{font:inherit;color:var(--txt);background:#0b0e13;border:1px solid var(--line);border-radius:10px;padding:12px 14px;outline:none;width:100%}
input:focus{border-color:var(--acc)}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Lobby */
#lobby{height:100%;display:flex;align-items:center;justify-content:center;gap:40px;padding:20px;flex-wrap:wrap;overflow:auto}
.pv{width:min(560px,100%);position:relative}
#preview{width:100%;aspect-ratio:16/10;background:#000;border-radius:16px;object-fit:cover;transform:scaleX(-1)}
.pvc{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:12px}
.form{width:min(380px,100%);display:flex;flex-direction:column;gap:14px}
.form h1{font-size:28px}.form p{color:var(--mut);font-size:14px;line-height:1.5}
.btn{background:var(--acc);color:#fff;padding:13px;border-radius:10px;font-weight:600}
.btn:hover{filter:brightness(1.1)}.btn:disabled{opacity:.5}
.ghost{color:var(--acc);font-size:14px;text-align:left}
#err{color:#ff7b7b;font-size:13px;min-height:18px}
.round{width:46px;height:46px;border-radius:50%;background:rgba(30,36,46,.9);display:flex;align-items:center;justify-content:center}
.round.off{background:var(--red)}

/* Meeting */
#meeting{height:100%;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line);font-size:14px;gap:10px}
header .m{color:var(--mut)}header b{color:var(--txt)}
#main{flex:1;display:flex;min-height:0}
#grid{flex:1;display:grid;gap:10px;padding:10px;min-width:0;overflow:auto}
.tile{position:relative;background:#000;border-radius:14px;overflow:hidden;min-height:110px;border:2px solid transparent;transition:border-color .15s}
.tile.speaking{border-color:var(--grn)}
.tile video{width:100%;height:100%;object-fit:cover;display:block}
.tile.me video{transform:scaleX(-1)}.tile.share video{object-fit:contain}
.av{position:absolute;inset:0;background:#1d2430;display:none;align-items:center;justify-content:center}
.av span{width:84px;height:84px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:600}
.tile.novid .av{display:flex}
.lbl{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.65);padding:4px 10px;border-radius:8px;font-size:13px;display:flex;gap:6px;align-items:center;max-width:80%}
.lbl .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile.muted .mi::before{content:'🔇'}.hd{display:none}.tile.hand .hd{display:inline}
.ed{display:none;font-style:normal;font-size:11px;color:#fbbf24;white-space:nowrap}.tile.educk .ed{display:inline}
.pin{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);border-radius:8px;padding:4px 7px;font-size:13px;opacity:0}
.tile:hover .pin{opacity:1}
#grid.spot{display:flex;flex-wrap:wrap;align-content:flex-start}
#grid.spot .tile{flex:0 0 200px;height:120px}
#grid.spot .tile.pinned{flex:1 1 100%;height:calc(100vh - 290px);order:-1}
#side{width:330px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:12px;color:var(--mut);font-size:14px}
.tabs button.on{color:var(--txt);border-bottom:2px solid var(--acc)}
.pane{flex:1;display:flex;flex-direction:column;min-height:0}
#msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;background:#222a36;padding:8px 12px;border-radius:12px;font-size:14px;word-break:break-word}
.msg.mine{align-self:flex-end;background:#1e3a68}
.msg small{display:block;color:var(--mut);font-size:11px;margin-bottom:2px}
#cf{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
#cf input{padding:10px 12px}#cf button{background:var(--acc);color:#fff;padding:0 16px;border-radius:10px}
#plist{list-style:none;overflow:auto;padding:8px}
#plist li{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;font-size:14px}
#plist li:hover{background:#1f2631}
.pav{width:32px;height:32px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
#plist .st{margin-left:auto;font-size:13px}#plist span:nth-child(2){flex:1;overflow:hidden;text-overflow:ellipsis}
#plist .pm{font-size:11px;color:var(--acc);padding:3px 8px;border:1px solid var(--line);border-radius:8px;white-space:nowrap}
#bar{display:flex;justify-content:center;gap:10px;padding:12px;border-top:1px solid var(--line);flex-wrap:wrap}
.cb{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:68px;padding:8px 10px;border-radius:12px;font-size:11px;color:var(--mut);position:relative}
.cb:hover{background:#1f2631;color:var(--txt)}
.cb.off svg,.cb.off{color:var(--red)}.cb.act{color:var(--acc)}
.cb.leave{color:#fff;background:var(--red)}.cb.leave:hover{filter:brightness(1.1);background:var(--red)}
.dot{position:absolute;top:4px;right:16px;background:var(--red);color:#fff;border-radius:9px;font-size:10px;padding:1px 5px}
#toasts{position:fixed;top:60px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:9}
.toast{background:#222a36;border:1px solid var(--line);padding:8px 16px;border-radius:10px;font-size:13px}
.rc{display:none;right:44px}.tile.share.remote .rc{display:block}
#ctlBar{position:fixed;top:56px;left:50%;transform:translateX(-50%);background:var(--acc);color:#fff;padding:8px 14px;border-radius:12px;font-size:13px;display:flex;gap:10px;align-items:center;z-index:8;box-shadow:0 4px 20px rgba(0,0,0,.4)}
#ctlBar.req{background:#b45309}#ctlBar button{background:rgba(255,255,255,.22);padding:4px 12px;border-radius:8px}
.tile.ctrl{border-color:var(--acc);cursor:crosshair}
.rcur{position:absolute;pointer-events:none;z-index:4;transition:left .05s linear,top .05s linear}
.rcur svg{width:22px;height:22px;fill:#f59e0b;stroke:#000;stroke-width:1}
.rcur b{position:absolute;left:16px;top:18px;background:#f59e0b;color:#000;font-size:11px;padding:1px 6px;border-radius:6px;white-space:nowrap}
.rip{position:absolute;width:30px;height:30px;margin:-15px;border-radius:50%;border:3px solid #f59e0b;pointer-events:none;animation:rip .5s forwards}
@keyframes rip{to{transform:scale(2.2);opacity:0}}
@media(max-width:760px){#side{position:fixed;inset:0;width:100%;z-index:5}.cb{min-width:54px}#grid.spot .tile.pinned{height:50vh}}
</style>
</head>
<body>

<!-- LOBBY -->
<div id="lobby">
  <div class="pv">
    <video id="preview" autoplay muted playsinline></video>
    <div class="pvc">
      <button class="round" id="pMic" title="Microphone"><svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg></button>
      <button class="round" id="pCam" title="Camera"><svg viewBox="0 0 24 24"><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2"/></svg></button>
    </div>
  </div>
  <div class="form">
    <h1>Pro Meet</h1>
    <p>Secure video meetings with chat, screen sharing and live participant sync powered by Firebase.</p>
    <p>🎧 Tip: headphones give the cleanest audio. If another device is in the same room, Pro Meet detects it and silences the duplicate audio automatically.</p>
    <input id="nameIn" placeholder="Your name" maxlength="30">
    <input id="roomIn" placeholder="Room code" maxlength="40">
    <button class="btn" id="joinBtn">Join meeting</button>
    <button class="ghost" id="newBtn">Generate a new room code</button>
    <div id="err"></div>
  </div>
</div>

<!-- MEETING -->
<div id="meeting" class="hidden">
  <header>
    <span>Room <b id="roomLbl"></b> <span class="m">· <span id="count">1</span> in call · <span id="timer">00:00</span></span></span>
    <button class="ghost" id="copyBtn">Copy invite link</button>
  </header>
  <div id="main">
    <div id="grid"></div>
    <aside id="side" class="hidden">
      <div class="tabs"><button id="tabChat" class="on">Chat</button><button id="tabPeople">People</button></div>
      <div class="pane" id="paneChat">
        <div id="msgs"></div>
        <form id="cf"><input id="chatIn" placeholder="Message everyone…" autocomplete="off"><button>Send</button></form>
      </div>
      <div class="pane hidden" id="panePeople"><ul id="plist"></ul></div>
    </aside>
  </div>
  <div id="bar">
    <button class="cb" id="micBtn"><svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg><span>Mute</span></button>
    <button class="cb" id="camBtn"><svg viewBox="0 0 24 24"><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2"/></svg><span>Stop video</span></button>
    <button class="cb act" id="noiseBtn" title="Cycle noise cancellation"><svg viewBox="0 0 24 24"><path d="M2 12h3l2-6 4 12 3-9 2 3h6"/></svg><span>Noise: Standard</span></button>
    <button class="cb act" id="echoBtn" title="Stops echo: gates your mic while others speak through speakers, and silences any participant whose audio is picked up by your microphone (same room)."><svg viewBox="0 0 24 24"><path d="M3 10v4M7 6v12M11 3v18M15 7v10M19 10v4"/></svg><span>Echo guard: On</span></button>
    <button class="cb" id="spkBtn" title="Mute incoming audio on this device"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg><span>Speaker</span></button>
    <button class="cb" id="shareBtn"><svg viewBox="0 0 24 24"><rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8M12 17v4"/></svg><span>Share</span></button>
    <button class="cb" id="handBtn"><svg viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-4 0v5M14 10V4a2 2 0 0 0-4 0v6M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-5.9-2.4L3.4 16a2 2 0 0 1 3.2-2.4L8 15"/></svg><span>Raise hand</span></button>
    <button class="cb" id="chatBtn"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Chat</span><i class="dot hidden" id="unread">0</i></button>
    <button class="cb" id="pplBtn"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg><span>People</span></button>
    <button class="cb leave" id="leaveBtn"><svg viewBox="0 0 24 24"><path d="M10.7 13.3a16 16 0 0 0 2.6 2l1.3-1.3a2 2 0 0 1 2.1-.5c.8.3 1.7.5 2.6.6a2 2 0 0 1 1.7 2v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 2 4.2 2 2 0 0 1 4 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.6a2 2 0 0 1-.5 2.1L8 9.7M22 2 2 22"/></svg><span>Leave</span></button>
  </div>
</div>
<div id="ctlBar" class="hidden"></div>
<div id="toasts"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, setPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, updateDoc, deleteDoc, addDoc, getDocs, onSnapshot, query, where, orderBy }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD66Xgj2uhcBOzYhwTuAcn5_wxLxDMkCeA",
  authDomain: "pro-meet-9e44e.firebaseapp.com",
  projectId: "pro-meet-9e44e",
  storageBucket: "pro-meet-9e44e.firebasestorage.app",
  messagingSenderId: "360559567109",
  appId: "1:360559567109:web:0f9bd0d407db2a5365d76c"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app), db = getFirestore(app);

const $ = id => document.getElementById(id);
const ICE = { iceServers: [{ urls: ["stun:stun.l.google.com:19302", "stun:stun1.l.google.com:19302"] }] };
const STALE = 45000;
const AUDIO_C = {
  echoCancellation: { ideal: true }, noiseSuppression: { ideal: true }, autoGainControl: { ideal: true },
  channelCount: { ideal: 1 }, sampleRate: { ideal: 48000 }, voiceIsolation: { ideal: true }
};

let me, room, localStream, screenTrack = null, localView, actx, pinned = null, chatOpen = false, unread = 0, firstSnap = true;
let partCol, sigCol, msgCol, myRef;
const roster = {}, peers = {}, speakers = {}, unsubs = [];
const echoMuted = {}, echoIgnore = {}, ech = {}, lv = {}, lastR = {}, lastNote = {};
let chain = Promise.resolve();

/* ================= Lobby ================= */
const hashRoom = decodeURIComponent(location.hash.slice(1));
if (hashRoom) $('roomIn').value = hashRoom;
$('newBtn').onclick = () => $('roomIn').value = Math.random().toString(36).slice(2, 5) + '-' + Math.random().toString(36).slice(2, 6);

/* Make sure the browser's echo canceller is really running on the microphone */
async function hardenMic(t) {
  try {
    const s = t.getSettings();
    if (s.echoCancellation === false || s.noiseSuppression === false || s.autoGainControl === false)
      await t.applyConstraints({ echoCancellation: true, noiseSuppression: true, autoGainControl: true });
  } catch {}
  return t.getSettings ? t.getSettings() : {};
}

(async () => {
  try { localStream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 }, audio: AUDIO_C }); }
  catch { try { localStream = await navigator.mediaDevices.getUserMedia({ audio: AUDIO_C }); } catch { localStream = new MediaStream(); $('err').textContent = 'No camera/mic found or permission denied. You can still join as a viewer.'; } }
  $('preview').srcObject = localStream; localView = localStream;
  const mt = localStream.getAudioTracks()[0];
  if (mt) {
    const as = await hardenMic(mt);
    if (as.echoCancellation === false) $('err').textContent = 'Echo cancellation is unavailable on this microphone. Please use headphones.';
  }
})();
const track = k => localStream && localStream.getTracks().find(t => t.kind === k);
$('pMic').onclick = e => { const t = track('audio'); if (t) { t.enabled = !t.enabled; e.currentTarget.classList.toggle('off', !t.enabled); } };
$('pCam').onclick = e => { const t = track('video'); if (t) { t.enabled = !t.enabled; e.currentTarget.classList.toggle('off', !t.enabled); } };

$('joinBtn').onclick = async () => {
  getCtx();
  const name = $('nameIn').value.trim() || 'Guest ' + Math.floor(Math.random() * 900 + 100);
  room = $('roomIn').value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '-');
  if (!room) return $('err').textContent = 'Enter a room code.';
  $('joinBtn').disabled = true; $('err').textContent = '';
  try {
    await setPersistence(auth, browserSessionPersistence);   // unique identity per tab
    const cred = await signInAnonymously(auth);
    me = { uid: cred.user.uid, name };
    await setupAudio();
    await enter();
    detectHeadphones();
  } catch (e) {
    console.error(e);
    $('err').textContent = 'Could not join (' + (e.code || e.message) + '). Enable Anonymous Auth + Firestore and publish the rules.';
    $('joinBtn').disabled = false;
    $('lobby').classList.remove('hidden'); $('meeting').classList.add('hidden');
  }
};

/* ================= Join the room ================= */
async function enter() {
  $('lobby').classList.add('hidden'); $('meeting').classList.remove('hidden');
  $('roomLbl').textContent = room; location.hash = room;
  partCol = collection(db, 'rooms', room, 'participants');
  sigCol = collection(db, 'rooms', room, 'signals');
  msgCol = collection(db, 'rooms', room, 'messages');
  myRef = doc(partCol, me.uid);

  const mine = { name: me.name, audio: !!track('audio')?.enabled, video: !!track('video')?.enabled, hand: false, sharing: false, joinedAt: Date.now(), seen: Date.now() };
  roster[me.uid] = mine; paint(me.uid); watch(me.uid, localStream);

  // drop stale signals from earlier sessions of this identity
  const old = await getDocs(query(sigCol, where('to', '==', me.uid)));
  await Promise.all(old.docs.map(d => deleteDoc(d.ref)));
  await setDoc(myRef, mine);

  // Roster sync
  unsubs.push(onSnapshot(partCol, snap => {
    snap.docChanges().forEach(ch => {
      const id = ch.doc.id, d = ch.doc.data();
      if (ch.type === 'removed') { if (id !== me.uid) { toast((roster[id]?.name || 'Someone') + ' left'); dropPeer(id, true); } return; }
      if (id !== me.uid && Date.now() - d.seen > STALE) { deleteDoc(ch.doc.ref).catch(() => {}); return; }
      if (id === me.uid) { return; }
      const prev = roster[id];
      if (prev && prev.joinedAt !== d.joinedAt) dropPeer(id, false);       // peer restarted
      const isNew = !prev || prev.joinedAt !== d.joinedAt;
      roster[id] = d;
      if (isNew) { if (!firstSnap) toast(d.name + ' joined'); if (me.uid < id) initiate(id); }
      paint(id);
    });
    firstSnap = false;
  }, e => console.error(e)));

  // Signaling inbox (offers / answers / ICE addressed to me)
  unsubs.push(onSnapshot(query(sigCol, where('to', '==', me.uid)), snap => {
    const items = snap.docChanges().filter(c => c.type === 'added').map(c => ({ ref: c.doc.ref, ...c.doc.data() })).sort((a, b) => a.ts - b.ts);
    items.forEach(s => { deleteDoc(s.ref).catch(() => {}); chain = chain.then(() => onSignal(s)).catch(console.warn); });
  }));

  // Persistent chat
  unsubs.push(onSnapshot(query(msgCol, orderBy('ts')), snap => {
    snap.docChanges().forEach(c => { if (c.type === 'added') { const m = c.doc.data(); addMsg(m); if (m.uid !== me.uid && !(chatOpen && !$('paneChat').classList.contains('hidden'))) bump(); } });
  }));

  // Heartbeat + stale sweep + timer
  const t0 = Date.now();
  setInterval(() => {
    updateDoc(myRef, { seen: Date.now() }).catch(() => {});
    for (const id in roster) if (id !== me.uid && Date.now() - roster[id].seen > STALE) deleteDoc(doc(partCol, id)).catch(() => {});
  }, 15000);
  setInterval(() => { const s = Math.floor((Date.now() - t0) / 1000); $('timer').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }, 1000);
  syncButtons();
}

/* ================= WebRTC (mesh, Firestore signaling) ================= */
const send = (to, type, data) => addDoc(sigCol, { from: me.uid, to, type, data: JSON.stringify(data), ts: Date.now() });

function getPeer(id) {
  if (peers[id]) return peers[id];
  const pc = new RTCPeerConnection(ICE), p = peers[id] = { pc, q: [], stream: null };
  const out = [track('audio'), screenTrack || track('video')].filter(Boolean);
  out.forEach(t => pc.addTrack(t, localStream));
  ['audio', 'video'].forEach(k => { if (!out.find(t => t.kind === k)) pc.addTransceiver(k, { direction: 'recvonly' }); });
  pc.ondatachannel = e => dc(id, e.channel);
  if (me.uid < id) dc(id, pc.createDataChannel('ctl'));
  pc.onicecandidate = e => e.candidate && send(id, 'candidate', e.candidate.toJSON());
  pc.ontrack = e => { p.stream = e.streams[0]; watch(id, p.stream); paint(id); };
  pc.onconnectionstatechange = () => { if (pc.connectionState === 'failed' && me.uid < id) initiate(id, true); };
  return p;
}
async function initiate(id, restart) {
  if (restart) dropPeer(id, false);
  const { pc } = getPeer(id);
  await pc.setLocalDescription(await pc.createOffer());
  send(id, 'offer', pc.localDescription.toJSON());
}
async function flush(p) { for (const c of p.q.splice(0)) await p.pc.addIceCandidate(c).catch(() => {}); }
async function onSignal(s) {
  const data = JSON.parse(s.data);
  if (s.type === 'offer' && peers[s.from]?.pc.remoteDescription) dropPeer(s.from, false);   // remote restarted
  const p = getPeer(s.from), pc = p.pc;
  if (s.type === 'offer') {
    await pc.setRemoteDescription(data); await flush(p);
    await pc.setLocalDescription(await pc.createAnswer());
    send(s.from, 'answer', pc.localDescription.toJSON());
  } else if (s.type === 'answer') { await pc.setRemoteDescription(data); await flush(p); }
  else if (pc.remoteDescription) await pc.addIceCandidate(data).catch(() => {});
  else p.q.push(data);
}
function dropPeer(id, full) {
  if (id === ctrlBy || id === ctrlTarget || id === pending) endControl(false);
  if (peers[id]) { peers[id].pc.close(); delete peers[id]; }
  delete speakers[id];
  if (full) {
    delete roster[id]; delete echoMuted[id]; delete echoIgnore[id]; delete ech[id]; delete lv[id]; delete lastR[id]; delete lastNote[id];
    $('t-' + id)?.remove(); if (pinned === id) pinned = null; renderPeople(); layout();
  }
}

/* ================= UI: tiles / layout ================= */
const initials = n => n.split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
function tile(id) {
  let t = $('t-' + id); if (t) return t;

/* ================= Level analysis (speaking highlight + echo detection) ================= */
const HOP = 25;            // ms between level samples
const WIN = 100;           // analysis window = 2.5 s
const RING = 200;          // ring length = 5 s
const fbuf = new Float32Array(2048);
lv.mic = new Float32Array(RING);
let tickN = 0, lastMicActive = -1e9, micAn = null;
let echoGuard = true, headphones = false, ducked = false, duckUntil = 0, spkOn = true;

function watch(id, stream) {
  if (speakers[id] || !stream || !stream.getAudioTracks().length) return;
  try {
    getCtx(); const a = actx.createAnalyser(); a.fftSize = 512;
    actx.createMediaStreamSource(stream).connect(a); speakers[id] = a;
  } catch {}
}
function rms(an) {
  const n = an.fftSize; an.getFloatTimeDomainData(fbuf);
  let s = 0; for (let i = 0; i < n; i++) s += fbuf[i] * fbuf[i];
  return Math.sqrt(s / n);
}

/* Best Pearson correlation between mic envelope A[i] and a participant's envelope B[i+k], k in [k0,k1] */
function bestCorr(A, B, k0, k1) {
  let top = -1;
  for (let k = k0; k <= k1; k++) {
    const i0 = Math.max(0, -k), i1 = Math.min(WIN - 1, WIN - 1 - k);
    let n = 0, sx = 0, sy = 0, sxx = 0, syy = 0, sxy = 0;
    for (let i = i0; i <= i1; i++) { const x = A[i], y = B[i + k]; n++; sx += x; sy += y; sxx += x * x; syy += y * y; sxy += x * y; }
    const vx = sxx - sx * sx / n, vy = syy - sy * sy / n;
    if (vx < 1e-6 || vy < 1e-6) continue;
    const c = (sxy - sx * sy / n) / Math.sqrt(vx * vy);
    if (c > top) top = c;
  }

}
/* Does my microphone hear what this participant is sending (my voice coming back, or them speaking in my room)?
   The mic leads their stream by the network delay (positive lag). Speaker leakage would show up at negative lag
   and is handled by the mic gate instead. */
function echoScore(id) {

  const A = new Float32Array(WIN), B = new Float32Array(WIN); let am = 0, at = 0;
  for (let i = 0; i < WIN; i++) {

    if (a > 0.015) am++; if (b > 0.015) at++;
    A[i] = Math.log(a + 0.002); B[i] = Math.log(b + 0.002);
  }
  if (am < 15 || at < 15) return 0;

  return pos > neg + 0.1 ? pos : 0;
}
function analyse(now) {
  for (const id in lv) {
    if (id === 'mic') continue;
    const e = ech[id] || (ech[id] = { streak: 0, hit: -1e9 });
    if (echoScore(id) > 0.6) { if (++e.streak >= 3) e.hit = now; }

}
function notifyEcho(id) {
  const n = performance.now(); if (n - (lastNote[id] || 0) < 60000) return; lastNote[id] = n;
  toast('Echo detected with ' + (roster[id]?.name || 'a participant') + ': muting their audio on this device while you speak');
}
function uiTick(now) {
  let far = 0, changed = false;
  for (const id in speakers) {
    const r = lastR[id] || 0, rs = roster[id];
    $('t-' + id)?.classList.toggle('speaking', r > 0.012 && rs?.audio !== false);
    if (id === me.uid) continue;
    const e = ech[id];
    const m = !!(echoGuard && !echoIgnore[id] && e && now - e.hit < 3000 && now - lastMicActive < 500);
    if (m !== !!echoMuted[id]) {
      echoMuted[id] = m; changed = true; applyPlayout(id);
      $('t-' + id)?.classList.toggle('educk', m); if (m) notifyEcho(id);
    }
    if (!echoMuted[id] && spkOn && rs?.audio !== false) far = Math.max(far, r);
  }

  // Speaker leakage guard: while someone is audible on my speakers, make the mic gate stricter
  const duckOn = echoGuard && !headphones && spkOn;

  if (!me) return;
  const i = tickN % RING, now = performance.now();
  const mr = micAn ? rms(micAn) : 0; lv.mic[i] = mr; if (mr > 0.015) lastMicActive = now;
  for (const id in speakers) {
    const v = rms(speakers[id]); lastR[id] = v;
    if (id !== me.uid) (lv[id] || (lv[id] = new Float32Array(RING)))[i] = v;
  }
  for (const id in lv) if (id !== 'mic' && !speakers[id]) delete lv[id];

/* ================= Noise cancellation pipeline =================
   Mic -> browser NS/AEC/AGC -> 90 Hz high-pass (rumble/hum) -> adaptive noise gate

let rawTrack = null, gateNode = null, noiseMode = 1;
const MODES = [{ n: 'Off', m: 0 }, { n: 'Standard', m: 2.5 }, { n: 'Strong', m: 4 }];
const GATE = `class G extends AudioWorkletProcessor{
constructor(){super();this.g=1;this.f=0.004;this.h=0;this.m=2.5;this.k=0;
this.port.onmessage=e=>{const d=e.data;if(typeof d==='number')this.m=d;else if(d&&'duck' in d)this.k=d.duck?1:0}}
process(i,o){const x=i[0][0],y=o[0];if(!x)return true;
let s=0;for(let n=0;n<x.length;n++)s+=x[n]*x[n];const r=Math.sqrt(s/x.length);
let t=Math.min(0.04,Math.max(0.006,this.f*this.m));
if(this.k)t=Math.max(t*2.5,0.035);
else{if(r<this.f)this.f=this.f*0.9+r*0.1;else if(r<=t)this.f=this.f*0.999+r*0.001;else this.f=Math.min(0.015,this.f*0.9999+r*0.0001)}

if(r>t)this.h=Math.round(sampleRate*(this.k?0.12:0.3)/128);

this.g+=((open?1:0.02)-this.g)*(open?0.5:(this.k?0.08:0.015))}

function getCtx() {

}
['click', 'keydown', 'touchstart', 'visibilitychange'].forEach(ev => addEventListener(ev, () => { if (actx && actx.state === 'suspended') actx.resume(); }, { passive: true }));
async function setupAudio() {
  const raw = track('audio'); if (!raw) return;
  try {
    const c = getCtx(); rawTrack = raw;
    const src = c.createMediaStreamSource(new MediaStream([raw]));
    const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 90;
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -28; comp.ratio.value = 4; comp.attack.value = 0.005; comp.release.value = 0.25;
    const dest = c.createMediaStreamDestination();

    micAn = c.createAnalyser(); micAn.fftSize = 512; hp.connect(micAn);    // pre-gate tap for echo detection
    let last = hp;
    try {
      await c.audioWorklet.addModule(URL.createObjectURL(new Blob([GATE], { type: 'application/javascript' })));
      gateNode = new AudioWorkletNode(c, 'gate', { channelCount: 1, channelCountMode: 'explicit', outputChannelCount: [1] });
      gateNode.port.postMessage(MODES[noiseMode].m); hp.connect(gateNode); last = gateNode;
    } catch (e) { console.warn('Adaptive gate unavailable, using filters only', e); }
    last.connect(comp); comp.connect(dest);
    const proc = dest.stream.getAudioTracks()[0];
    try { proc.contentHint = 'speech'; } catch {}
    proc.enabled = raw.enabled; raw.enabled = true;          // keep lobby mute state; mute now acts on the processed track

$('noiseBtn').onclick = () => {

  noiseMode = (noiseMode + 1) % MODES.length; gateNode.port.postMessage(MODES[noiseMode].m);
  $('noiseBtn').querySelector('span').textContent = 'Noise: ' + MODES[noiseMode].n;
  $('noiseBtn').classList.toggle('act', noiseMode > 0);

};
function setEcho() { $('echoBtn').classList.toggle('act', echoGuard); $('echoBtn').querySelector('span').textContent = 'Echo guard: ' + (echoGuard ? 'On' : 'Off'); }
$('echoBtn').onclick = () => {

/* ================= Remote control of a shared screen =================
   Request -> sharer approves -> controller's mouse/keyboard stream over a WebRTC data channel.
   Browsers cannot move the OS cursor, so the sharer sees a labelled remote pointer + click ripples;

}
function showBar(text, btns, cls) {
  const b = $('ctlBar'); b.className = cls || ''; b.textContent = text;
  btns.forEach(([l, f]) => { const x = document.createElement('button'); x.textContent = l; x.onclick = f; b.append(x); });
}
const hideBar = () => { $('ctlBar').className = 'hidden'; };

function requestControl(id) {
  if (ctrlTarget || pending) return toast('A control request is already active');
  if (!roster[id]?.sharing) return;
  if (!sendCtl(id, { t: 'req' })) return toast('Connection not ready, try again in a moment');
  pending = id; toast('Control requested from ' + roster[id].name);
}
function onCtl(from, m) {
  const name = roster[from]?.name || 'Someone';

    showBar(name + ' requests control of your screen', [['Allow', () => grant(from)], ['Deny', () => { sendCtl(from, { t: 'deny' }); hideBar(); }]], 'req');
  } else if (m.t === 'grant') { if (pending === from) { pending = null; startCtrl(from); } }
  else if (m.t === 'deny') { if (pending === from) { pending = null; toast(name + ' declined' + (m.why ? ' (' + m.why + ')' : '')); } }
  else if (m.t === 'revoke') { if (from === ctrlBy || from === ctrlTarget) { toast('Control ended'); endControl(false); } }

}
function endControl(notify) {
  const other = ctrlBy || ctrlTarget; if (notify && other) sendCtl(other, { t: 'revoke' });
  offCtl?.(); offCtl = null; ctrlBy = ctrlTarget = pending = null; hideBar();
  $('t-' + me.uid)?.querySelectorAll('.rcur,.rip').forEach(n => n.remove()); cur = null;
}

/* Controller side: capture input on the remote tile */
function startCtrl(id) {
  ctrlTarget = id; const t = $('t-' + id), v = t.querySelector('video'); t.classList.add('ctrl');
  showBar('Controlling ' + roster[id].name + "'s screen", [['Release', () => endControl(true)]]);

  const pos = e => {
    const r = v.getBoundingClientRect(), vw = v.videoWidth, vh = v.videoHeight; if (!vw) return null;
    const k = Math.min(r.width / vw, r.height / vh), cw = vw * k, ch = vh * k;

}

/* Sharer side: show the controller's pointer (and forward to the optional agent) */

    if (!cur || !cur.isConnected) {

      cur.innerHTML = '<svg viewBox="0 0 24 24"><path d="M4 3l16 7-7 2-2 7z"/></svg><b></b>';
      cur.querySelector('b').textContent = roster[ctrlBy]?.name || ''; t.append(cur);
    }
    const r = v.getBoundingClientRect(), vw = v.videoWidth || 1, vh = v.videoHeight || 1, k = Math.min(r.width / vw, r.height / vh), cw = vw * k, ch = vh * k;

  $('paneChat').classList.toggle('hidden', tab !== 'chat'); $('panePeople').classList.toggle('hidden', tab !== 'people');
  $('tabChat').classList.toggle('on', tab === 'chat'); $('tabPeople').classList.toggle('on', tab !== 'chat');
  if (tab === 'chat') { unread = 0; $('unread').classList.add('hidden'); $('msgs').scrollTop = 1e9; }
}
$('chatBtn').onclick = () => openPanel('chat'); $('pplBtn').onclick = () => openPanel('people');
$('tabChat').onclick = () => { chatOpen = false; openPanel('chat'); }; $('tabPeople').onclick = () => { chatOpen = false; openPanel('people'); };
function bump() { unread++; $('unread').textContent = unread; $('unread').classList.remove('hidden'); }

/* Chat */
$('cf').onsubmit = e => {
  e.preventDefault(); const text = $('chatIn').value.trim(); if (!text) return;
  addDoc(msgCol, { uid: me.uid, name: me.name, text: text.slice(0, 1000), ts: Date.now() }).catch(() => toast('Message failed'));
  $('chatIn').value = '';
};
function addMsg(m) {
  const d = document.createElement('div'); d.className = 'msg' + (m.uid === me.uid ? ' mine' : '');
  const h = document.createElement('small'), b = document.createElement('span');
  h.textContent = (m.uid === me.uid ? 'You' : m.name) + ' · ' + new Date(m.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  b.textContent = m.text; d.append(h, b); $('msgs').append(d); $('msgs').scrollTop = 1e9;
}

/* Misc */
$('copyBtn').onclick = () => {
  navigator.clipboard.writeText(location.origin + location.pathname + '#' + room);
  $('copyBtn').textContent = 'Copied!'; setTimeout(() => $('copyBtn').textContent = 'Copy invite link', 1500);
};
async function leave() {
  unsubs.forEach(u => u()); Object.keys(peers).forEach(id => dropPeer(id, false));
  await deleteDoc(myRef).catch(() => {});
  localStream.getTracks().forEach(t => t.stop()); screenTrack?.stop(); rawTrack?.stop(); location.reload();
}
$('leaveBtn').onclick = leave;
addEventListener('beforeunload', () => { if (myRef) deleteDoc(myRef); });
addEventListener('keydown', e => {
  if (!me || /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.key === 'm') toggleMic(); if (e.key === 'v') toggleCam(); if (e.key === 'c') openPanel('chat');
});

/* Start the level sampler (drives speaking highlight, echo guard and same-room echo detection) */
setInterval(sample, HOP);
</script>
<script type="module" src="attach.js"></script>
</body>
</html>
